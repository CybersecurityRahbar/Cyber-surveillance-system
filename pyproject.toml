[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cyber-surveillance-system"
version = "0.2.0"
description = "A Python platform for intelligent traffic and visual-security surveillance."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.10,<5",
  "ultralytics>=8.4.63,<9",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
traffic-surveillance = "traffic_surveillance.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_surveillance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
