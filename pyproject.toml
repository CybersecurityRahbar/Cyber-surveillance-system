[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cyber-surveillance-system"
version = "0.1.0"
description = "A modular, defensive cyber-security monitoring and investigation platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary project code; third-party components retain their own licenses." }
authors = [{ name = "CybersecurityRahbar" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
cyber-surveillance = "cyber_surveillance.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_surveillance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
