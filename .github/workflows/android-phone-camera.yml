name: Android Phone Camera

on:
  push:
    paths:
      - "android-phone-camera/**"
      - ".github/workflows/android-phone-camera.yml"
  pull_request:
    paths:
      - "android-phone-camera/**"
      - ".github/workflows/android-phone-camera.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android-phone-camera
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cybervision-phone-camera-debug
          path: android-phone-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
