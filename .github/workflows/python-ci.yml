name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,video,test-video]"

      - name: Ruff
        run: ruff check src tests

      - name: JavaScript syntax
        run: node --check src/traffic_surveillance/web/lab.js

      - name: Validate Colab notebook JSON
        run: python -c "import json; json.load(open('notebooks/Google_Colab_Lab.ipynb', encoding='utf-8'))"

      - name: Validate executable Colab configuration
        run: python -m pytest tests/test_colab_notebook.py -q

      - name: Unit and API tests
        run: pytest --cov=traffic_surveillance --cov-report=term-missing
